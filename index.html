<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta 
    name="viewport" 
    content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
  />
  <meta name="theme-color" content="#050816" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Re-Stocker V4.Turbo</title>

  <!-- PWA stuff -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />

  <!-- Main styles -->
  <link rel="stylesheet" href="styles.css" />

  <!-- Only the splash & tiny extras live inline -->
  <style>
    #splash {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: grid;
      place-items: center;
      background: #050816;
      transition: opacity .7s ease;
    }
    #splash img {
      width: 70vw;
      max-width: 420px;
      border-radius: 22px;
      box-shadow: 0 14px 40px rgba(0,0,0,.7);
      animation: splashZoom 1.2s ease forwards;
    }
    #splash.hide {
      opacity: 0;
      pointer-events: none;
    }
    @keyframes splashZoom {
      from { transform: scale(1); opacity: 1; }
      to   { transform: scale(1.12); opacity: 1; }
    }

    /* Shopping badge – main styling in styles.css but keep fallback */
    .tab-badge {
      position: absolute;
      top: -5px;
      right: -6px;
      background: #ff4f6b;
      color: #fff;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 999px;
      display: none;
    }
    .tab-badge.show { display: inline-block; }
  </style>
</head>

<body class="theme-dark">
  <!-- Splash overlay -->
  <div id="splash" aria-hidden="true">
    <!-- use your neon hex wallpaper saved as splash.png -->
    <img src="splash.png" alt="Re-Stocker loading splash" />
  </div>

  <!-- Top bar -->
  <header class="app-header">
    <div class="app-title">
      <img src="icon-192.png" class="logo" alt="Re-Stocker icon" />
      <div>
        <h1>Re-Stocker</h1>
        <small>V4.Turbo · Neon Midnight</small>
      </div>
    </div>

    <!-- Dark / light toggle controlled in app.js -->
    <button id="theme-toggle" class="pill-btn" type="button">☾</button>
  </header>

  <!-- Toast notifications -->
  <div id="toast-root"></div>

  <!-- Main shell -->
  <main class="shell">
    <!-- Navigation tabs -->
    <nav class="tabs" aria-label="Main sections">
      <button class="tab active" data-tab="inventory">Inventory</button>

      <button class="tab" data-tab="shopping">
        Shopping
        <span class="tab-badge" id="shopping-badge"></span>
      </button>

      <button class="tab" data-tab="add">Add</button>
      <button class="tab" data-tab="summary">Summary</button>
      <button class="tab" data-tab="settings">Settings</button>
    </nav>

    <!-- Views (content injected by app.js) -->
    <section id="inventory-view" class="view">
      <p class="muted">Loading inventory…</p>
    </section>

    <section id="shopping-view" class="view hidden">
      <p class="muted">Loading shopping list…</p>
    </section>

    <section id="add-view" class="view hidden">
      <p class="muted">Loading add form…</p>
    </section>

    <section id="summary-view" class="view hidden">
      <p class="muted">Loading summary…</p>
    </section>

    <section id="settings-view" class="view hidden">
      <p class="muted">Loading settings…</p>
    </section>

    <footer class="app-footer">
      <small>Re-Stocker V4.Turbo · Hybrid · Offline-first</small>
    </footer>
  </main>

  <!-- Main app logic -->
  <script type="module" src="app.js"></script>

  <!-- Splash fade-out bootstrap -->
  <script>
    window.addEventListener('load', () => {
      const splash = document.getElementById('splash');
      setTimeout(() => splash.classList.add('hide'), 600);
      setTimeout(() => splash.remove(), 1400);
    });
  </script>
</body>
</html>
